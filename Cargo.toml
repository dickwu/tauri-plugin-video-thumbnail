[package]
name = "tauri-plugin-video-thumbnail"
version = "0.1.0"
authors = [ "You" ]
description = "Generate video thumbnails from URLs or local paths"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-video-thumbnail"

[dependencies]
tauri = { version = "2.9.4" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
thumbnailer = "0.5"
mime = "0.3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio = { version = "1", features = ["fs"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-plugin = { version = "2.5.2", features = ["build"] }
